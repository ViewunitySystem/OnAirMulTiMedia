<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA App</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            padding: 2rem; 
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .app { 
            max-width: 400px; 
            margin: 0 auto; 
            text-align: center;
        }
        .install-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 1rem;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>PWA App Template</h1>
        <p>Progressive Web App generated by OAMTM Evolve Engine.</p>
        <button class="install-btn" id="installBtn">Install App</button>
        <div id="status">Status: Ready</div>
    </div>
    <script type="module">
        import PWAApp from './template.js';
        
        const app = new PWAApp({
            name: 'OAMTM PWA',
            shortName: 'OAMTM',
            version: '1.0.0',
            themeColor: '#000000',
            backgroundColor: '#ffffff',
            offline: true
        });

        app.registerServiceWorker();
        document.getElementById('status').textContent = 'Status: PWA Loaded';
        
        document.getElementById('installBtn').addEventListener('click', () => {
            app.install();
        });
    </script>
</body>
</html>
