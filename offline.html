<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline – OnAirMulTiMedia</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#0b0f17;--fg:#eaf0ff;--muted:#a6b0c9;--accent:#22c55e}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto}
    main{min-height:100%;display:grid;place-items:center;padding:2rem}
    .card{max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:2rem;text-align:center}
    h1{margin:0 0 .5rem;font-size:clamp(28px,4vw,48px)}p{margin:.2rem 0;color:var(--muted)}
    a.btn{display:inline-block;margin-top:1rem;padding:.8rem 1.1rem;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7dd3fc);color:#001020;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <section class="card" data-offline>
      <h1>Du bist offline</h1>
      <p>Keine Verbindung. Wir zeigen dir eine minimale App‑Shell.</p>
      <a class="btn" href="./">Startseite neu laden</a>
      <p style="margin-top:1rem">Fallback: <code>offline.html</code></p>
    </section>
  </main>
</body>
</html>
