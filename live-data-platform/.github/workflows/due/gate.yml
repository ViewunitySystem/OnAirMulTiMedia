name: Due Diligence Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DUE_DILIGENCE_TIMEOUT: 300  # 5 minutes

jobs:
  minimal-smoke-test:
    name: Minimal Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Verification
        run: |
          echo "🔨 Building application..."
          npm run build
          
          # Verify build artifacts exist
          if [ -d "dist" ]; then
            echo "✅ Build artifacts created successfully"
            ls -la dist/
          else
            echo "❌ Build artifacts missing"
            exit 1
          fi
          
      - name: Schema Validation
        run: |
          echo "📋 Validating schemas..."
          npm run schema:validate || echo "⚠️ Schema validation warnings (non-blocking)"
        continue-on-error: true
        
      - name: Stream Probe Test
        run: |
          echo "🌊 Testing stream connectivity..."
          
          # Start the application in background
          npm start &
          APP_PID=$!
          
          # Wait for application to start
          sleep 10
          
          # Test health endpoint
          if curl -f http://localhost:3000/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            kill $APP_PID
            exit 1
          fi
          
          # Test SSE stream endpoint (non-blocking)
          timeout 5 curl -f http://localhost:3000/stream/weather/nowcast/test-region || echo "⚠️ SSE stream test timeout (non-blocking)"
          
          # Cleanup
          kill $APP_PID
          
      - name: Lint & Audit (Non-blocking)
        run: |
          echo "🔍 Running lint and security audit..."
          
          # Lint check
          npm run lint || echo "⚠️ Lint warnings (non-blocking)"
          
          # Security audit
          npm audit --audit-level=high || echo "⚠️ Security audit warnings (non-blocking)"
        continue-on-error: true
        
      - name: Performance Quick Check
        run: |
          echo "⚡ Quick performance check..."
          
          # Check bundle size
          if [ -d "dist" ]; then
            BUNDLE_SIZE=$(du -sh dist/ | cut -f1)
            echo "📦 Bundle size: $BUNDLE_SIZE"
            
            # Check for large files (>10MB)
            LARGE_FILES=$(find dist/ -type f -size +10M)
            if [ -n "$LARGE_FILES" ]; then
              echo "⚠️ Large files detected:"
              echo "$LARGE_FILES"
            else
              echo "✅ No oversized files detected"
            fi
          fi
          
      - name: Generate Gate Report
        run: |
          echo "📊 Generating gate report..."
          
          mkdir -p due/results
          
          cat > due/results/gate-report.md << EOF
          # Due Diligence Gate Report
          
          **Date:** $(date)
          **PR:** ${{ github.event.pull_request.number }}
          **Branch:** ${{ github.head_ref }}
          
          ## Test Results
          
          ### Build Verification
          - ✅ Build completed successfully
          - ✅ Build artifacts present
          
          ### Stream Connectivity
          - ✅ Health endpoint responsive
          - ⚠️ SSE stream test (non-blocking)
          
          ### Code Quality
          - ⚠️ Lint warnings (non-blocking)
          - ⚠️ Security audit warnings (non-blocking)
          
          ### Performance
          - 📦 Bundle size: $(du -sh dist/ 2>/dev/null | cut -f1 || echo "N/A")
          
          ## Recommendation
          **Status:** ✅ PASS (with warnings)
          
          Non-blocking warnings detected. Proceed with caution.
          
          EOF
          
      - name: Upload Gate Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: due-diligence-gate-results
          path: due/results/
          retention-days: 7

  due-diligence-summary:
    name: Due Diligence Summary
    runs-on: ubuntu-latest
    needs: minimal-smoke-test
    if: always()
    
    steps:
      - name: Download Gate Results
        uses: actions/download-artifact@v4
        with:
          name: due-diligence-gate-results
          path: due/results/
          
      - name: Generate Summary
        run: |
          echo "📋 Due Diligence Summary"
          echo "========================="
          
          if [ -f "due/results/gate-report.md" ]; then
            cat due/results/gate-report.md
          else
            echo "❌ Gate report not found"
          fi
          
          echo ""
          echo "🔗 Next Steps:"
          echo "- Review non-blocking warnings"
          echo "- Consider full due diligence run"
          echo "- Monitor performance metrics"
          
      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let report = '## 🔍 Due Diligence Gate Results\n\n';
            
            try {
              const gateReport = fs.readFileSync('due/results/gate-report.md', 'utf8');
              report += gateReport;
            } catch (error) {
              report += '❌ Gate report not available\n';
            }
            
            report += '\n\n---\n*Automated Due Diligence Gate - Non-blocking warnings detected*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
