<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Module</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; }
        .module { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="module">
        <h1>Basic Module Template</h1>
        <p>This is a basic module generated by OAMTM Evolve Engine.</p>
        <div id="status">Status: Ready</div>
    </div>
    <script type="module">
        document.getElementById('status').textContent = 'Status: Loaded';
    </script>
</body>
</html>
