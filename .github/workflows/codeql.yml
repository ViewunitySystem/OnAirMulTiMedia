name: CodeQL

on:
  push:
    branches: [ mainzero, gh-pages ]
  pull_request:
    branches: [ mainzero, gh-pages ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    with:
      languages: javascript-typescript, rust
