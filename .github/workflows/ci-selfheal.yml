name: CI & Self-Healing

on:
  push:
    branches: [ gh-pages, mainzero, main ]
  pull_request:
    branches: [ gh-pages, mainzero, main ]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # Self-Healing Orchestrator
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install -g typescript tsx

      - name: Verify GitHub Pages Source
        if: ${{ github.ref == 'refs/heads/gh-pages' }}
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Verifying GitHub Pages source configuration..."
          
          # Get current Pages source
          SRC=$(gh api repos/${{ github.repository }}/pages --jq '.source.branch' 2>/dev/null || echo "null")
          echo "📋 Current Pages source: $SRC"
          
          if [ "$SRC" != "gh-pages" ]; then
            echo "❌ ERROR: GitHub Pages source is '$SRC', expected 'gh-pages'"
            echo "🔧 Attempting to fix Pages source configuration..."
            
            # Try to set Pages source to gh-pages
            gh api repos/${{ github.repository }}/pages \
              --method PUT \
              --field source='{"branch":"gh-pages","path":"/"}' \
              || echo "Failed to update Pages source"
          else
            echo "✅ GitHub Pages source correctly configured as 'gh-pages'"
          fi

      - name: Run Self-Healing Rules
        run: |
          echo "🔧 Running self-healing rules..."
          
          # Create selfheal-changed marker file
          touch .selfheal-changed
          
          # Rule 1: Fix index.html redirects
          if [ -f "index.html" ]; then
            echo "🔍 Checking index.html for redirects..."
            if grep -q "meta.*refresh\|location\.replace\|location\.href" index.html; then
              echo "⚠️  Found redirect in index.html, fixing..."
              
              # Create backup
              cp index.html index.html.backup
              
              # Replace redirect with iframe
              cat > index.html << 'EOF'
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>OnAirMulTiMedia</title>
                  <meta name="description" content="OnAirMulTiMedia - Universal Multimedia Platform">
                  <meta name="referrer" content="no-referrer">
                  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self' wss://*; base-uri 'none'; frame-ancestors 'self'; upgrade-insecure-requests">
                  <style>
                      body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
                      #inlay { border: 0; width: 100%; height: 100vh; }
                  </style>
              </head>
              <body>
                  <iframe id="inlay" src="./info.html" loading="lazy" referrerpolicy="no-referrer"></iframe>
                  
                  <script>
                      // Service Worker Registration
                      window.addEventListener('load', () => {
                          if ('serviceWorker' in navigator) {
                              navigator.serviceWorker.register('/sw.js').catch(console.error);
                          }
                      });
                      
                      // Error handling for iframe
                      document.getElementById('inlay').addEventListener('error', (e) => {
                          console.error('Iframe load error:', e);
                          document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><h1>Loading Error</h1><p>Please refresh the page.</p></div>';
                      });
                  </script>
              </body>
              </html>
              EOF
              echo "✅ Fixed index.html redirect"
              echo "index.html" >> .selfheal-changed
            fi
          fi
          
          # Rule 2: Fix info.html frame-busting
          if [ -f "info.html" ]; then
            echo "🔍 Checking info.html for frame-busting..."
            if grep -q "top.*location\|parent.*location\|window\.top" info.html; then
              echo "⚠️  Found frame-busting in info.html, fixing..."
              
              # Create backup
              cp info.html info.html.backup
              
              # Remove frame-busting scripts
              sed -i '/top.*location\|parent.*location\|window\.top/d' info.html
              
              # Add iframe-safe comment
              sed -i '1i<!-- iframe-compatible: frame-busting removed -->' info.html
              
              echo "✅ Fixed info.html frame-busting"
              echo "info.html" >> .selfheal-changed
            fi
          fi
          
          # Rule 3: Add Service Worker if missing
          if [ ! -f "sw.js" ]; then
            echo "🔧 Creating Service Worker..."
            cat > sw.js << 'EOF'
            // OnAirMulTiMedia Service Worker
            const CACHE_NAME = 'oamtm-v1';
            const OFFLINE_URL = '/offline.html';

            self.addEventListener('install', (event) => {
              console.log('SW: Installing...');
              self.skipWaiting();
            });

            self.addEventListener('activate', (event) => {
              console.log('SW: Activating...');
              event.waitUntil(self.clients.claim());
            });

            self.addEventListener('fetch', (event) => {
              event.respondWith(
                (async () => {
                  try {
                    const response = await fetch(event.request);
                    return response;
                  } catch (error) {
                    console.log('SW: Fetch failed, serving offline page');
                    return new Response('Offline', { 
                      status: 503,
                      headers: { 'Content-Type': 'text/html' }
                    });
                  }
                })()
              );
            });
            EOF
            echo "✅ Created Service Worker"
            echo "sw.js" >> .selfheal-changed
          fi
          
          # Rule 4: Add offline.html if missing
          if [ ! -f "offline.html" ]; then
            echo "🔧 Creating offline page..."
            cat > offline.html << 'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Offline - OnAirMulTiMedia</title>
                <style>
                    body { font-family: system-ui; text-align: center; padding: 50px; }
                    .offline { color: #666; }
                </style>
            </head>
            <body>
                <div class="offline">
                    <h1>📡 Offline</h1>
                    <p>You're currently offline. Please check your connection.</p>
                    <button onclick="location.reload()">Retry</button>
                </div>
            </body>
            </html>
            EOF
            echo "✅ Created offline page"
            echo "offline.html" >> .selfheal-changed
          fi
          
          # Rule 5: Fix .gitignore
          if [ -f ".gitignore" ]; then
            echo "🔍 Checking .gitignore..."
            if ! grep -q "*.exe\|*.msi\|dist/\|target/" .gitignore; then
              echo "⚠️  Updating .gitignore..."
              cat >> .gitignore << 'EOF'

              # Binaries
              *.exe
              *.msi
              *.dmg
              *.deb
              *.AppImage

              # Build directories
              /dist
              /.next
              /out
              /node_modules
              /target

              # Logs
              *.log
              *.tmp

              # OS files
              .DS_Store
              Thumbs.db
              EOF
              echo "✅ Updated .gitignore"
              echo ".gitignore" >> .selfheal-changed
            fi
          fi
          
          # Rule 6: Add CSP headers to HTML files
          echo "🔍 Checking for CSP headers..."
          for file in *.html; do
            if [ -f "$file" ] && ! grep -q "Content-Security-Policy" "$file"; then
              echo "⚠️  Adding CSP to $file..."
              sed -i '/<head>/a\    <meta http-equiv="Content-Security-Policy" content="default-src '\''self'\''; img-src '\''self'\'' data:; script-src '\''self'\''; style-src '\''self'\''; connect-src '\''self'\'' wss://*; base-uri '\''none'\''; frame-ancestors '\''self'\''; upgrade-insecure-requests">' "$file"
              echo "✅ Added CSP to $file"
              echo "$file" >> .selfheal-changed
            fi
          done
          
          echo "🔧 Self-healing rules completed"

      - name: Run TypeScript Self-Healing Script
        run: |
          if [ -f "scripts/selfheal.ts" ]; then
            echo "🔧 Running TypeScript self-healing script..."
            npx tsx scripts/selfheal.ts || echo "Self-healing script failed"
          else
            echo "ℹ️  No TypeScript self-healing script found"
          fi

      - name: Check for Changes
        id: changes
        run: |
          if [ -s .selfheal-changed ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "📝 Files changed:"
            cat .selfheal-changed
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes needed"
          fi

      - name: Create Pull Request with Fixes
        if: steps.changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/selfheal-${{ github.run_id }}
          title: "🔧 chore(selfheal): automated fixes"
          commit-message: "🔧 chore(selfheal): automated fixes"
          body: |
            ## 🤖 Automated Self-Healing Fixes
            
            This PR contains automated fixes from the self-healing system:
            
            **Files Modified:**
            ```bash
            ${{ steps.changes.outputs.changed-files }}
            ```
            
            **Changes Applied:**
            - Fixed HTML redirects and frame-busting
            - Added Service Worker and offline support
            - Updated .gitignore for better hygiene
            - Added Content Security Policy headers
            - Verified GitHub Pages source configuration
            
            **Review & Merge:**
            Please review these automated changes and merge if appropriate.
            
            ---
            *Generated by self-healing workflow at $(date -u +%Y-%m-%dT%H:%M:%SZ)*
          delete-branch: true
          labels: |
            automated
            self-healing
            maintenance

      - name: Commit Direct Fixes (gh-pages branch)
        if: steps.changes.outputs.has-changes == 'true' && github.ref == 'refs/heads/gh-pages'
        run: |
          echo "🔧 Committing fixes directly to gh-pages branch..."
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          git commit -m "🔧 chore(selfheal): automated fixes" || echo "No changes to commit"
          
          git push origin gh-pages || echo "Push failed"

  # Continuous Integration Tests
  ci-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run Linting
        run: |
          npm run lint --if-present || echo "Linting not configured"

      - name: Run Tests
        run: |
          npm test --if-present || echo "Tests not configured"

      - name: Check Build
        run: |
          npm run build --if-present || echo "Build not configured"

      - name: Security Audit
        run: |
          npm audit --audit-level=moderate || echo "Security issues found"

  # Repository Hygiene Check
  hygiene-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Binary Files
        run: |
          echo "🔍 Checking for binary files in repository..."
          
          # Find binary files
          BINARY_FILES=$(find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -not -path "./.git/*")
          
          if [ -n "$BINARY_FILES" ]; then
            echo "❌ Binary files found:"
            echo "$BINARY_FILES"
            echo "⚠️  These should be removed and added to .gitignore"
            exit 1
          else
            echo "✅ No binary files found"
          fi

      - name: Check Lockfiles
        run: |
          echo "🔍 Checking for lockfiles..."
          
          if [ -f "package.json" ] && [ ! -f "package-lock.json" ] && [ ! -f "pnpm-lock.yaml" ] && [ ! -f "yarn.lock" ]; then
            echo "⚠️  No lockfile found for npm dependencies"
            echo "💡 Consider running 'npm install' to generate package-lock.json"
          else
            echo "✅ Lockfile found"
          fi
          
          if [ -f "Cargo.toml" ] && [ ! -f "Cargo.lock" ]; then
            echo "⚠️  No Cargo.lock found for Rust dependencies"
            echo "💡 Consider running 'cargo build' to generate Cargo.lock"
          else
            echo "✅ Cargo.lock found"
          fi

      - name: Check .gitignore
        run: |
          echo "🔍 Checking .gitignore completeness..."
          
          if [ ! -f ".gitignore" ]; then
            echo "❌ No .gitignore file found"
            exit 1
          fi
          
          # Check for common patterns
          REQUIRED_PATTERNS=("node_modules" "dist" "target" "*.log")
          
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "⚠️  Missing pattern in .gitignore: $pattern"
            fi
          done
          
          echo "✅ .gitignore check completed"

  # Deployment Status Check
  status-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check GitHub Pages Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking GitHub Pages deployment status..."
          
          # Get Pages status
          STATUS=$(gh api repos/${{ github.repository }}/pages --jq '.status' 2>/dev/null || echo "unknown")
          echo "📋 Pages status: $STATUS"
          
          if [ "$STATUS" != "built" ]; then
            echo "⚠️  GitHub Pages may have issues"
          else
            echo "✅ GitHub Pages is healthy"
          fi

      - name: Check Firebase Status
        run: |
          echo "🔍 Checking Firebase deployment status..."
          
          # Test Firebase URLs
          for site in onairmultimedia onairmultimedia-staging onairmultimedia-dev; do
            URL="https://$site.web.app"
            echo "🔗 Testing $URL..."
            
            if curl -s -o /dev/null -w "%{http_code}" "$URL" | grep -q "200"; then
              echo "✅ $site is accessible"
            else
              echo "⚠️  $site may have issues"
            fi
          done

  # Summary
  summary:
    needs: [heal, ci-tests, hygiene-check, status-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔧 Self-Healing & CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Self-Healing Status
          if [ "${{ needs.heal.result }}" = "success" ]; then
            echo "✅ **Self-Healing:** Completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Self-Healing:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # CI Tests Status
          if [ "${{ needs.ci-tests.result }}" = "success" ]; then
            echo "✅ **CI Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CI Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Hygiene Check Status
          if [ "${{ needs.hygiene-check.result }}" = "success" ]; then
            echo "✅ **Repository Hygiene:** Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  **Repository Hygiene:** Issues found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Status Check
          if [ "${{ needs.status-check.result }}" = "success" ]; then
            echo "✅ **Deployment Status:** Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  **Deployment Status:** Issues detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Self-healing workflow completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)*" >> $GITHUB_STEP_SUMMARY
