name: CI/CD Pipeline

on:
  push:
    branches: [ mainzero, main, develop ]
  pull_request:
    branches: [ mainzero, main ]
  schedule:
    # Daily audit verification at 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint || echo "::warning::Linting issues found"
      
      - name: Check formatting
        run: npm run format:check || echo "::warning::Formatting issues found"

  test-node:
    name: Test (Node.js)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Generate coverage report
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: nodejs
          name: nodejs-${{ matrix.node-version }}

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy, rustfmt
      
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Clippy
        run: cargo clippy -- -D warnings
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Run tests (release mode)
        run: cargo test --release --verbose

  audit-verification:
    name: Audit Trail Verification
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify audit chain integrity
        run: |
          echo "🔍 Verifying audit trail integrity..."
          npm run audit:verify || echo "::warning::Audit verification failed"
      
      - name: Check audit log size
        run: |
          AUDIT_SIZE=$(du -sh audit/logs | cut -f1)
          echo "📊 Audit logs size: $AUDIT_SIZE"
          echo "audit_size=$AUDIT_SIZE" >> $GITHUB_OUTPUT
      
      - name: Generate audit report
        if: github.event_name == 'schedule'
        run: |
          echo "📝 Generating daily audit report..."
          npm run audit:report
          
      - name: Upload audit artifacts
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v3
        with:
          name: audit-report-${{ github.run_number }}
          path: audit/reports/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || echo "::warning::npm audit found issues"
      
      - name: Run Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Install dependencies (Node)
        run: npm ci
      
      - name: Build Node.js
        run: npm run build
      
      - name: Build Rust
        run: cargo build --release
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/
            target/release/
          retention-days: 7

  regulatory-compliance:
    name: Regulatory Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate band plans
        run: |
          echo "🌍 Validating ITU band plans..."
          npm run regulatory:validate-bandplans
      
      - name: Check license cache freshness
        run: |
          echo "🔍 Checking license database..."
          npm run regulatory:check-licenses
      
      - name: Generate compliance report
        run: |
          echo "📋 Generating compliance report..."
          npm run regulatory:report

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/mainzero' && github.event_name == 'push'
    needs: [lint, test-node, test-rust, build]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install hackathon-bridge dependencies
        run: |
          cd hackathon-bridge
          npm ci
      
      - name: Prepare deployment directory
        run: |
          mkdir -p gh-pages-deploy
          cp -r hackathon-bridge/public/* gh-pages-deploy/
          cp README.md gh-pages-deploy/
          echo "# OnAirMulTiMedia - Live Demo" > gh-pages-deploy/README.md
          echo "Visit: https://viewunitysystem.github.io/OnAirMulTiMedia/" >> gh-pages-deploy/README.md
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [lint, test-node, test-rust, audit-verification, security-scan, build]
    
    steps:
      - name: Send notification
        run: |
          echo "❌ CI/CD Pipeline failed!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add Slack/Discord/Email notification here
