name: CI

on:
  push:
    branches: [ mainzero, gh-pages ]
  pull_request:
    branches: [ mainzero, gh-pages ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node+Rust)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        rust: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node / PNPM
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Enable Corepack (pnpm optional)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate || true

      - name: Install JS deps (root)
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm i --frozen-lockfile; \
          elif [ -f package-lock.json ]; then npm ci; \
          else npm i; fi

      - name: Install JS deps (webui)
        if: ${{ hashFiles('webui/package.json') != '' }}
        working-directory: ./webui
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm i --frozen-lockfile; \
          elif [ -f package-lock.json ]; then npm ci; \
          else npm i; fi

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            **/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Lint / Typecheck
      - name: Lint (ESLint)
        if: hashFiles('**/.eslintrc*') != ''
        run: |
          npm run lint --if-present || pnpm run lint || true

      - name: Typecheck (TS)
        run: |
          npm run typecheck --if-present || pnpm run typecheck || npx tsc -p . --noEmit

      - name: Rust fmt
        if: ${{ hashFiles('core/**') != '' }}
        working-directory: ./core
        run: cargo fmt --all -- --check

      - name: Rust clippy
        if: ${{ hashFiles('core/**') != '' }}
        working-directory: ./core
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Tests
      - name: Unit tests (Vitest)
        run: |
          npm run test:unit --if-present || pnpm run test:unit || npx vitest run --coverage

      - name: Rust tests
        if: ${{ hashFiles('core/**') != '' }}
        working-directory: ./core
        run: cargo test --all --all-features --verbose

      # Build WebUI
      - name: Build webui
        if: ${{ hashFiles('webui/**') != '' }}
        working-directory: ./webui
        run: |
          npm run build --if-present || pnpm run build || npx vite build

      # Playwright E2E nur auf Linux
      - name: Install Playwright deps
        if: runner.os == 'Linux' && hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps

      - name: E2E (Playwright)
        if: runner.os == 'Linux' && hashFiles('playwright.config.*') != ''
        run: npx playwright test
        env:
          CI: 'true'

      # Security
      - name: Install cargo-audit
        if: ${{ hashFiles('core/**') != '' }}
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then cargo install cargo-audit; fi

      - name: Cargo audit
        if: ${{ hashFiles('core/**') != '' }}
        working-directory: ./core
        run: cargo audit --json > audit-report.json || true

      - name: NPM audit
        run: |
          npx npm-audit-resolver || npm audit --audit-level=moderate || true

      # Artifacts
      - name: Upload dist (web)
        if: always() && hashFiles('webui/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist-${{ matrix.os }}
          path: webui/dist
          if-no-files-found: ignore

      - name: Upload coverage (vitest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage
            .nyc_output
          if-no-files-found: ignore

      - name: Upload Rust audit
        if: always() && hashFiles('core/audit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rust-audit-${{ matrix.os }}
          path: core/audit-report.json
          if-no-files-found: ignore
