name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
        browser: [chrome, firefox]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: |
        npm ci
        npm install -g serve
        
    - name: 🏗️ Build Application
      run: |
        npm run build
        
    - name: 🧪 Run Unit Tests
      run: |
        npm run test:unit
        
    - name: 🧪 Run Integration Tests
      run: |
        npm run test:integration
        
    - name: 🎨 Lint Code
      run: |
        npm run lint
        
    - name: 📊 Test Coverage
      run: |
        npm run test:coverage
        
    - name: 📤 Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info

  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🔍 Run Security Audit
      run: |
        npm audit --audit-level=high
        npm run security:scan
        
    - name: 🛡️ Run SAST Scan
      uses: github/codeql-action/init@v2
      with:
        languages: javascript
        
    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  performance:
    name: ⚡ Performance Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🏗️ Build Application
      run: npm run build
      
    - name: 🚀 Start Application
      run: |
        npm run serve &
        sleep 10
        
    - name: 📊 Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun
        
    - name: 📈 Performance Budget
      run: |
        npm run perf:budget

  accessibility:
    name: ♿ Accessibility Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🏗️ Build Application
      run: npm run build
      
    - name: 🚀 Start Application
      run: |
        npm run serve &
        sleep 10
        
    - name: ♿ Run Accessibility Tests
      run: |
        npm run test:a11y
        
    - name: 🔍 Run axe-core Tests
      run: |
        npm run axe:test

  internationalization:
    name: 🌍 Internationalization Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
        
    - name: 🌍 Test All Languages
      run: |
        npm run test:i18n
        
    - name: 📝 Check Translation Completeness
      run: |
        npm run i18n:check
        
    - name: 🔤 Validate Translation Keys
      run: |
        npm run i18n:validate

  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: [test, security, performance, accessibility, internationalization]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🏗️ Build Application
      run: npm run build
      
    - name: 🚀 Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        
    - name: 🧪 Run E2E Tests
      run: |
        npm run test:e2e:staging

  deploy-production:
    name: 🌐 Deploy to Production
    needs: [test, security, performance, accessibility, internationalization]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🏗️ Build Application
      run: npm run build:production
      
    - name: 🏷️ Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## 🚀 OnAirMulTiMedia Release v${{ github.run_number }}
          
          ### ✨ Features
          - Neue Features und Verbesserungen
          
          ### 🐛 Bug Fixes
          - Behobene Bugs
          
          ### 📚 Documentation
          - Aktualisierte Dokumentation
          
          ### 🔧 Technical Changes
          - Technische Verbesserungen
        draft: false
        prerelease: false
        
    - name: 🌐 Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        
    - name: 🧪 Run Production Tests
      run: |
        npm run test:e2e:production
        
    - name: 📊 Post-Deploy Monitoring
      run: |
        npm run monitor:deploy

  notify:
    name: 📢 Notify Team
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📢 Notify Success
      if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        # Add notification logic here (Slack, Discord, Email)
        
    - name: 📢 Notify Failure
      if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        # Add notification logic here (Slack, Discord, Email)
