[package]
name = "hfrf-universal-sdr"
version = "1.0.0"
edition = "2021"

[dependencies]
num-complex = "0.4"
rustfft = "6.1"
realfft = "3.2"
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serialport = "4.3"
hex = "0.4"
regex = "1.0"
fastrand = "2.0"
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "test_server"
path = "src/bin/test_server.rs"

[[bin]]
name = "canvas_server"
path = "src/bin/canvas_server.rs"
