name = "oamtm-submission-api"
compatibility_date = "2025-10-03"

# Environment Variables (set in Cloudflare Dashboard)
[vars]
GITHUB_REPO = "ViewunitySystem/OnAirMulTiMedia"

# Secrets (set via wrangler secret put)
# GITHUB_TOKEN = "your-fine-grained-pat"
# OPENAI_API_KEY = "optional-openai-key"

# Routes (commented out for local development)
# routes = [
#   { pattern = "api.onairmultimedia.com/*", zone_name = "onairmultimedia.com" }
# ]

# Build Configuration
[build]
command = "npm run build"
cwd = "api"

# KV Storage für Matrix.org-Style Serverfarm
[[kv_namespaces]]
binding = "PUBLIC_ROOMS"
id = "oamtm-public-rooms"
preview_id = "oamtm-public-rooms-preview"

[[kv_namespaces]]
binding = "MEDIA_CONTENT"
id = "oamtm-media-content"
preview_id = "oamtm-media-content-preview"

[[kv_namespaces]]
binding = "USER_SESSIONS"
id = "oamtm-user-sessions"
preview_id = "oamtm-user-sessions-preview"
