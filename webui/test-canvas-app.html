<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFRF Universal SDR - Test Canvas App (Lokale Simulation)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #444;
        }
        .test-button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .test-button:hover {
            background: #45a049;
        }
        .result {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
        .canvas-container {
            border: 2px solid #444;
            margin: 20px 0;
            background: #000;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        .simulation-notice {
            background: #5c4b1a;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HFRF Universal SDR - Test Canvas App</h1>
        
        <div class="simulation-notice">
            ⚠️ <strong>Simulation Mode:</strong> Alle API-Tests verwenden lokale Demo-Daten statt externe APIs
        </div>

        <div class="test-section">
            <h2>📡 API Tests (Simulation)</h2>
            <button class="test-button" onclick="testSpectrumAPI()">Test Spektrum API</button>
            <button class="test-button" onclick="testProxyAPI()">Test Proxy API</button>
            <button class="test-button" onclick="testRoyaltyAPI()">Test Royalty API</button>
            <button class="test-button" onclick="testAllAPIs()">Alle APIs testen</button>
            <div id="api-results"></div>
        </div>

        <div class="test-section">
            <h2>🎨 Canvas Visualisierung</h2>
            <button class="test-button" onclick="initCanvas()">Canvas initialisieren</button>
            <button class="test-button" onclick="drawSpectrum()">Spektrum zeichnen</button>
            <button class="test-button" onclick="drawWaveform()">Waveform zeichnen</button>
            <button class="test-button" onclick="clearCanvas()">Canvas leeren</button>
            <div class="canvas-container">
                <canvas id="testCanvas" width="800" height="400"></canvas>
            </div>
        </div>

        <div class="test-section">
            <h2>📊 Test Ergebnisse</h2>
            <div id="test-results"></div>
        </div>
    </div>

    <script>
        // Lokale Simulation statt externe APIs
        const API_BASE = 'simulation://local';
        const PROXY_BASE = 'simulation://local/proxy?url=';
        const ROYALTY_ENDPOINT = 'simulation://local/royalty';

        // Test Spektrum API (Simulation)
        async function testSpectrumAPI() {
            const resultsDiv = document.getElementById('api-results');
            try {
                // Simuliere API-Aufruf
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const mockData = {
                    frequency: 433.92,
                    power: -45.2,
                    bandwidth: 12.5,
                    modulation: 'FSK',
                    timestamp: new Date().toISOString(),
                    data: Array.from({length: 100}, (_, i) => Math.random() * 100)
                };
                
                resultsDiv.innerHTML = `
                    <div class="result success">
                        ✅ Spektrum API erfolgreich! (Simulation)
                        Frequenz: ${(mockData.frequency).toFixed(3)} MHz
                        Bandbreite: ${(mockData.bandwidth).toFixed(2)} MHz
                        Datenpunkte: ${mockData.data.length}
                        Timestamp: ${new Date(mockData.timestamp).toLocaleString()}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        ❌ Spektrum API Fehler: ${error.message}
                    </div>
                `;
            }
        }

        // Test Proxy API (Simulation)
        async function testProxyAPI() {
            const resultsDiv = document.getElementById('api-results');
            try {
                // Simuliere Proxy-Aufruf
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const mockData = {
                    url: 'https://httpbin.org/get',
                    status: 200,
                    message: 'Proxy erfolgreich (Simulation)',
                    timestamp: new Date().toISOString()
                };
                
                resultsDiv.innerHTML = `
                    <div class="result success">
                        ✅ Proxy API erfolgreich! (Simulation)
                        URL: ${mockData.url}
                        Status: ${mockData.status}
                        Message: ${mockData.message}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        ❌ Proxy API Fehler: ${error.message}
                    </div>
                `;
            }
        }

        // Test Royalty API (Simulation)
        async function testRoyaltyAPI() {
            const resultsDiv = document.getElementById('api-results');
            try {
                // Simuliere Royalty-Aufruf
                await new Promise(resolve => setTimeout(resolve, 1200));
                
                const mockData = {
                    artist: 'Demo Artist',
                    track: 'Demo Track',
                    royalty: 0.15,
                    currency: 'EUR',
                    timestamp: new Date().toISOString()
                };
                
                resultsDiv.innerHTML = `
                    <div class="result success">
                        ✅ Royalty API erfolgreich! (Simulation)
                        Artist: ${mockData.artist}
                        Track: ${mockData.track}
                        Royalty: ${mockData.royalty} ${mockData.currency}
                        Timestamp: ${new Date(mockData.timestamp).toLocaleString()}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        ❌ Royalty API Fehler: ${error.message}
                    </div>
                `;
            }
        }

        // Test alle APIs (Simulation)
        async function testAllAPIs() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="result">🔄 Teste alle APIs...</div>';
            
            try {
                await Promise.all([
                    testSpectrumAPI(),
                    new Promise(resolve => setTimeout(resolve, 500)),
                    testProxyAPI(),
                    new Promise(resolve => setTimeout(resolve, 500)),
                    testRoyaltyAPI()
                ]);
                
                resultsDiv.innerHTML += `
                    <div class="result success">
                        ✅ Alle API-Tests abgeschlossen! (Simulation)
                        • Spektrum API: ✅
                        • Proxy API: ✅
                        • Royalty API: ✅
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        ❌ Fehler bei API-Tests: ${error.message}
                    </div>
                `;
            }
        }

        // Canvas Funktionen
        let canvas, ctx;

        function initCanvas() {
            canvas = document.getElementById('testCanvas');
            ctx = canvas.getContext('2d');
            
            // Canvas Setup
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            
            document.getElementById('test-results').innerHTML = `
                <div class="result success">✅ Canvas initialisiert (${canvas.width}x${canvas.height})</div>
            `;
        }

        function drawSpectrum() {
            if (!ctx) {
                initCanvas();
            }
            
            // Spektrum-Daten simulieren
            const spectrumData = Array.from({length: 200}, () => Math.random() * 100);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#00ff00';
            ctx.beginPath();
            
            spectrumData.forEach((value, index) => {
                const x = (index / spectrumData.length) * canvas.width;
                const y = canvas.height - (value / 100) * canvas.height;
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.stroke();
            
            document.getElementById('test-results').innerHTML = `
                <div class="result success">✅ Spektrum gezeichnet (${spectrumData.length} Datenpunkte)</div>
            `;
        }

        function drawWaveform() {
            if (!ctx) {
                initCanvas();
            }
            
            // Waveform-Daten simulieren
            const waveformData = Array.from({length: 400}, (_, i) => 
                Math.sin(i * 0.1) * 50 + Math.random() * 20
            );
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            waveformData.forEach((value, index) => {
                const x = (index / waveformData.length) * canvas.width;
                const y = canvas.height / 2 + value;
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.stroke();
            
            document.getElementById('test-results').innerHTML = `
                <div class="result success">✅ Waveform gezeichnet (${waveformData.length} Datenpunkte)</div>
            `;
        }

        function clearCanvas() {
            if (!ctx) {
                initCanvas();
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            document.getElementById('test-results').innerHTML = `
                <div class="result success">✅ Canvas geleert</div>
            `;
        }

        // Auto-Start
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Test Canvas App mit lokaler Simulation initialisiert');
            initCanvas();
        });
    </script>
</body>
</html>
