<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OnAirMulTiMedia – Start</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://onair-edge.telcotelekom.workers.dev wss://onair-edge.telcotelekom.workers.dev; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com; base-uri 'self'; upgrade-insecure-requests">
  <link rel="stylesheet" href="./assets/landing.css" />
  <script src="./self-healing-system.js"></script>
  <!-- Keine Meta‑Refresh/JS‑Redirects mehr -->
  <!-- Keine X-Frame-Options im <meta> (nur per Header wirksam) -->
  <!-- Links RELATIV halten (./...), damit Pages‑Subpfad funktioniert -->

</head>

<body>
  <header class="top">
    <h1>OnAirMulTiMedia</h1>
    <nav>
      <a href="./info.html">Info</a>
      <a href="./blueprints.html">Blueprints</a>
      <a href="./manifest.html">Manifest</a>
      <a href="./regulatory.html">Regulatory</a>
      <a href="./serverfarm-dashboard.html">Serverfarm</a>
      <a href="./onair-overlay.html">OnAir Widget</a>
    </nav>
  </header>

  <main class="hero">
    <section class="panel">
      <h2>Self‑Healing System Status</h2>
      <div class="frame-wrap">
        <div id="self-healing-status" style="padding: 1rem; background: #1a1f2e; border-radius: 8px; color: #e5e7eb;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem;">
            <div>
              <div style="font-size: 12px; opacity: 0.8;">Cloudflare Worker</div>
              <div id="worker-status" style="font-size: 18px; font-weight: bold; color: #22c55e;">Online</div>
            </div>
            <div>
              <div style="font-size: 12px; opacity: 0.8;">WebSocket</div>
              <div id="ws-status" style="font-size: 18px; font-weight: bold; color: #22c55e;">Active</div>
            </div>
            <div>
              <div style="font-size: 12px; opacity: 0.8;">Auto-Recovery</div>
              <div id="recovery-status" style="font-size: 18px; font-weight: bold; color: #22c55e;">Enabled</div>
            </div>
            <div>
              <div style="font-size: 12px; opacity: 0.8;">Last Check</div>
              <div id="last-check" style="font-size: 18px; font-weight: bold; color: #93c5fd;">Now</div>
            </div>
          </div>
          <div style="margin-top: 1rem;">
            <button onclick="testSelfHealing()" style="background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem;">
              🧪 Test Self-Healing
            </button>
            <button onclick="showRecoveryLog()" style="background: #10b981; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">
              📋 Recovery Log
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Info‑Dashboard (eingebettet)</h2>
      <div class="frame-wrap">
        <iframe src="./info.html" title="Info‑Dashboard" loading="lazy" referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
      </div>
    </section>
  </main>

  <script>
    // Self-Healing Test Functions
    function testSelfHealing() {
      if (window.selfHealingSystem) {
        window.selfHealingSystem.testSelfHealing();
      } else {
        console.warn('Self-Healing System not initialized');
        alert('Self-Healing System nicht verfügbar');
      }
    }

    function showRecoveryLog() {
      if (window.selfHealingSystem) {
        const log = window.selfHealingSystem.getRecoveryLog();
        const logText = log.map(entry => 
          `${entry.timestamp}: [${entry.type.toUpperCase()}] ${entry.message}`
        ).join('\n');
        
        alert(`Self-Healing Recovery Log:\n\n${logText || 'Keine Recovery-Versuche bisher'}`);
      } else {
        console.warn('Self-Healing System not initialized');
        alert('Self-Healing System nicht verfügbar');
      }
    }

    // Initialize Self-Healing System when page loads
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🔧 OnAirMulTiMedia Self-Healing System aktiviert');
    });
  </script>
</body>

</html>
