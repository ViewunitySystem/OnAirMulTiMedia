<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Seite nicht gefunden</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f17;
      color: #eaf0ff;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 { color: #f472b6; }
    a { color: #7dd3fc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .loading { opacity: 0.7; }
  </style>
</head>
<body>
  <h1>404 - Seite nicht gefunden</h1>
  <p>Die angeforderte Seite wird geladen...</p>
  <p class="loading">Automatische Weiterleitung in 3 Sekunden...</p>
  
  <script>
    (function(){
      var l = window.location;
      var base = '/OnAirMulTiMedia';
      var target = base + '/index.html?redirect=' + encodeURIComponent(l.pathname + l.search + l.hash);
      
      // Sofortige Weiterleitung
      window.location.replace(target);
      
      // Fallback nach 3 Sekunden
      setTimeout(function() {
        window.location.href = base + '/';
      }, 3000);
    })();
  </script>
</body>
</html>
