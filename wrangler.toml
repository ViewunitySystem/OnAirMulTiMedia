name = "onair-edge"
main = "src/worker.js"
compatibility_date = "2024-10-05"
workers_dev = false

# route = { pattern = "api.<deine-domain>", custom_domain = true }

[placement]
mode = "smart"

[vars]
ALLOWED_ORIGINS = "https://viewunitysystem.github.io,https://<deine-domain>"
TURN_REALM = "turn.<deine-domain>"

# ⚠️ Diese als Secrets setzen (wrangler secret put ...)
# PRIMARY_BASE = "https://europe-west1-<project>.cloudfunctions.net/api"
# BACKUP_BASE  = "https://us-central1-<project>.cloudfunctions.net/api"
# TURN_SHARED_SECRET = "<coturn-static-auth-secret>"
# AUTHORIZED_TOKEN = "OnAir2024SecureToken" # SICHERHEIT: Token für API-Zugriff

# [[durable_objects.bindings]]
# name = "ROOMS"
# class_name = "RoomsDO"

[[migrations]]
tag = "v2"
deleted_classes = ["RoomsDO"]

# (Optional) KV für Edge-Caching leichter Metriken
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<kv-id>"

# (Optional) R2 für Audits/Exports
# [[r2_buckets]]
