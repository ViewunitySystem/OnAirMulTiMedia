version: '3.8'

services:
  hackathon-bridge:
    build: .
    container_name: oamtm-hackathon-bridge
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: oamtm-hackathon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - hackathon-bridge
    restart: unless-stopped
    profiles:
      - proxy

  # Optional: Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: oamtm-hackathon-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hackathon-bridge
    restart: unless-stopped
    profiles:
      - proxy

volumes:
  caddy_data:
  caddy_config:
