<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge Test Client</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background:#0f172a; color:#e5e7eb; }
    header { padding: 12px 16px; background:#111827; position: sticky; top:0; display:flex; gap:12px; align-items:center; }
    main { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; padding:16px; }
    section { background:#111827; border-radius:12px; padding:12px; }
    input, button, select, textarea { background:#0b1020; color:#e5e7eb; border:1px solid #374151; border-radius:8px; padding:8px; width: 100%; }
    button { cursor:pointer; }
    .log { height: 40vh; overflow:auto; background:#0b1020; padding:8px; border-radius:8px; }
    .row { margin-bottom:6px; }
    code { font-family: ui-monospace, Menlo, monospace; font-size:12px; }

    /* Inlay window */
    .inlay-window { position: fixed; bottom: 16px; right: 16px; width: 560px; height: 320px; background:#000; border:1px solid #374151; border-radius:12px; overflow:hidden; resize: both; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 9999; display:none; }
    .inlay-toolbar { height: 40px; background:#0b1020; color:#e5e7eb; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 8px; cursor:move; user-select:none; }
    .inlay-title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 60%; }
    .inlay-actions { display:flex; gap:6px; }
    .inlay-actions button { width: 36px; height: 28px; padding:0; border-radius:8px; }
    .inlay-iframe { width: 100%; height: calc(100% - 40px); border:0; background:#000; }
    .badge { margin-left: 8px; font-size: 12px; opacity:.8; }
  </style>
</head>
<body>
  <header>
    <strong>Bridge Test Client</strong>
    <span id="status">connecting…</span>
  </header>
  <main>
    <section>
      <h3>Connect</h3>
      <div style="display:grid; gap:8px;">
        <label>User ID <input id="userId" placeholder="alice" /></label>
        <label>Variant <input id="variant" placeholder="web-ui" /></label>
        <button id="btnConnect">Connect</button>
        <button id="btnDisconnect">Disconnect</button>
      </div>
      <hr />
      <h3>Room</h3>
      <div style="display:grid; gap:8px;">
        <label>Room ID <input id="room" placeholder="room id" /></label>
        <button id="join">Join</button>
        <button id="leave">Leave</button>
      </div>
      <hr />
      <h3>Message</h3>
      <div style="display:grid; gap:8px;">
        <textarea id="msg" rows="3" placeholder="Hello world"></textarea>
        <button id="send">Send</button>
      </div>
      <hr />
      <h3>Inlay / Reference Host</h3>
      <div style="display:grid; gap:8px;">
        <label>URL <input id="inlayUrl" placeholder="https://example.com or YouTube URL"/></label>
        <div style="display:flex; gap:8px;">
          <button id="openInlay">Open Inlay</button>
          <button id="shareInlay">Open & Share to Room</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="auroraBtn" title="Play Aurora - Diluculum">▶ Aurora – Diluculum</button>
          <span class="badge">privacy-friendly embed</span>
        </div>
      </div>
    </section>
    <section>
      <h3>WebRTC (signaling)</h3>
      <div style="display:grid; gap:8px;">
        <label>Target Session ID <input id="target" placeholder="peer session_id (optional)"/></label>
        <button id="rtcOffer">Send Offer</button>
        <button id="rtcAnswer">Send Answer</button>
        <button id="rtcIce">Send ICE</button>
      </div>
      <hr/>
      <h3>Upload</h3>
      <div style="display:grid; gap:8px;">
        <input type="file" id="file" />
        <button id="upload">Upload to room</button>
      </div>
      <hr/>
      <h3>Log</h3>
      <div id="log" class="log"></div>
    </section>
  </main>

  <!-- Inlay Window -->
  <div id="inlayWin" class="inlay-window">
    <div class="inlay-toolbar" id="inlayToolbar">
      <div class="inlay-title" id="inlayTitle">Inlay</div>
      <div class="inlay-actions">
        <button id="inlayMax" title="Maximize/Restore">⬜</button>
        <button id="inlayClose" title="Close">✕</button>
      </div>
    </div>
    <iframe id="inlayFrame" class="inlay-iframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script src="/webtrit-swipe.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null; let session_id = null; let user_id = null;
    const logDiv = document.getElementById('log');
    function log(...args){
      const row = document.createElement('div'); row.className='row';
      row.innerHTML = `<code>${args.map(a=> (typeof a==='string'?a:JSON.stringify(a))).join(' ')}</code>`;
      logDiv.prepend(row);
    }

    function connect(){
      user_id = document.getElementById('userId').value || `user_${Math.random().toString(36).slice(2,7)}`;
      const variant = document.getElementById('variant').value || 'web-ui';
      socket = io('/bridge', { auth: { userId: user_id, variant } });
      socket.on('connect', ()=>{ document.getElementById('status').textContent='connected'; });
      socket.on('disconnect', ()=>{ document.getElementById('status').textContent='disconnected'; });
      socket.on('bridge:welcome', (p)=>{ session_id = p.session_id; log('welcome', p); });
      socket.on('msg:new', (m)=> log('msg', m));
      socket.on('typing', (t)=> log('typing', t));
      socket.on('webrtc:offer', (d)=> log('got offer', d));
      socket.on('webrtc:answer', (d)=> log('got answer', d));
      socket.on('webrtc:ice', (d)=> log('got ice', d));

      // Inlay instructions from server
      socket.on('inlay:open', ({ url, title, opened_by }) => {
        log('inlay:open', { url, title, opened_by });
        openInlay(url, title || 'Inlay');
      });
      socket.on('inlay:close', ({ closed_by }) => {
        log('inlay:close', { closed_by });
        closeInlay();
      });
    }

    document.getElementById('btnConnect').onclick = connect;
    document.getElementById('btnDisconnect').onclick = ()=> socket?.disconnect();

    document.getElementById('join').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      if (!room) return alert('room required');
      socket.emit('room:join', { room_id: room });
    };
    document.getElementById('leave').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      if (!room) return alert('room required');
      socket.emit('room:leave', { room_id: room });
    };

    document.getElementById('send').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      const body = document.getElementById('msg').value.trim();
      if (!room || !body) return alert('room + message required');
      socket.emit('msg:send', { room_id: room, body });
    };

    document.getElementById('rtcOffer').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      const target = document.getElementById('target').value.trim() || null;
      socket.emit('webrtc:offer', { room_id: room || null, target_session_id: target, sdp: { type: 'offer', sdp: 'dummy-offer' } });
    };
    document.getElementById('rtcAnswer').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      const target = document.getElementById('target').value.trim() || null;
      socket.emit('webrtc:answer', { room_id: room || null, target_session_id: target, sdp: { type: 'answer', sdp: 'dummy-answer' } });
    };
    document.getElementById('rtcIce').onclick = ()=>{
      const room = document.getElementById('room').value.trim();
      const target = document.getElementById('target').value.trim() || null;
      socket.emit('webrtc:ice', { room_id: room || null, target_session_id: target, candidate: { candidate: 'candidate:1 1 udp 2122260223 192.168.0.2 54915 typ host' } });
    };

    document.getElementById('upload').onclick = async ()=>{
      const room = document.getElementById('room').value.trim();
      const f = document.getElementById('file').files[0];
      if (!f) return alert('file required');
      const fd = new FormData();
      fd.append('file', f);
      fd.append('room_id', room);
      fd.append('uploader_session_id', session_id || 'unknown');
      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      const json = await res.json();
      log('uploaded', json);
      socket.emit('file:shared', { room_id: room || null, file: json });
    };

    // ---------- Inlay logic ----------
    const inlay = document.getElementById('inlayWin');
    const inlayTitle = document.getElementById('inlayTitle');
    const inlayFrame = document.getElementById('inlayFrame');
    const inlayToolbar = document.getElementById('inlayToolbar');
    const inlayMaxBtn = document.getElementById('inlayMax');
    const inlayCloseBtn = document.getElementById('inlayClose');

    let isMax = false;
    let lastBounds = null; // {width,height,right,bottom}

    function toEmbedURL(url){
      try {
        const u = new URL(url);
        // YouTube transforms to privacy-enhanced domain
        if (u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')){
          let vid = '';
          if (u.hostname.includes('youtu.be')) vid = u.pathname.slice(1);
          else if (u.searchParams.get('v')) vid = u.searchParams.get('v');
          const list = u.searchParams.get('list');
          const base = `https://www.youtube-nocookie.com/embed/${vid || ''}`;
          const params = new URLSearchParams();
          params.set('autoplay','1');
          params.set('rel','0');
          if (list) params.set('list', list);
          return `${base}?${params.toString()}`;
        }
        return url;
      } catch(e){ return url; }
    }

    function openInlay(url, title='Inlay'){
      inlayTitle.textContent = title;
      inlay.style.display = 'block';
      inlay.removeAttribute('data-hidden');
      inlayFrame.src = toEmbedURL(url);
      // ensure defaults if previously maximized
      if (isMax) toggleMax();
    }
    function closeInlay(){
      inlayFrame.src = 'about:blank';
      inlay.style.display = 'none';
      inlay.setAttribute('data-hidden','1');
    }
    function toggleMax(){
      if (!isMax){
        lastBounds = { width: inlay.style.width, height: inlay.style.height, right: inlay.style.right, bottom: inlay.style.bottom };
        inlay.style.right = '0'; inlay.style.bottom = '0'; inlay.style.width = '100vw'; inlay.style.height = '100vh';
        inlay.style.borderRadius = '0';
        isMax = true; inlayMaxBtn.textContent = '🗗';
      } else {
        inlay.style.width = lastBounds?.width || '560px';
        inlay.style.height = lastBounds?.height || '320px';
        inlay.style.right = lastBounds?.right || '16px';
        inlay.style.bottom = lastBounds?.bottom || '16px';
        inlay.style.borderRadius = '12px';
        isMax = false; inlayMaxBtn.textContent = '⬜';
      }
    }

    // Dragging via toolbar
    (function enableDrag(){
      let dragging = false; let startX=0, startY=0; let startRight=0, startBottom=0;
      inlayToolbar.addEventListener('mousedown', (e)=>{
        dragging = true; startX = e.clientX; startY = e.clientY;
        startRight = parseInt(getComputedStyle(inlay).right);
        startBottom = parseInt(getComputedStyle(inlay).bottom);
        document.body.style.userSelect = 'none';
      });
      window.addEventListener('mousemove', (e)=>{
        if (!dragging || isMax) return;
        const dx = e.clientX - startX; const dy = e.clientY - startY;
        inlay.style.right = (startRight - dx) + 'px';
        inlay.style.bottom = (startBottom - dy) + 'px';
      });
      window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; });
    })();

    inlayMaxBtn.onclick = toggleMax;
    inlayCloseBtn.onclick = ()=>{
      closeInlay();
      const room = document.getElementById('room').value.trim();
      socket.emit('inlay:close', { room_id: room || null });
    };

    // UI actions
    document.getElementById('openInlay').onclick = ()=>{
      const url = document.getElementById('inlayUrl').value.trim();
      if (!url) return alert('URL required');
      openInlay(url, url);
    };
    document.getElementById('shareInlay').onclick = ()=>{
      const url = document.getElementById('inlayUrl').value.trim();
      const room = document.getElementById('room').value.trim();
      if (!url) return alert('URL required');
      if (!room) return alert('room required to share');
      socket.emit('inlay:open', { room_id: room, url, title: url });
      openInlay(url, url);
    };

    // Aurora – Diluculum quick action
    document.getElementById('auroraBtn').onclick = ()=>{
      const yt = 'https://youtu.be/mNBFnZ4qi5Y?list=OLAK5uy_kq2PVRQQDGLRG4jH1a87Qr22s937BkNSk';
      openInlay(yt, 'Aurora – Diluculum');
      const room = document.getElementById('room').value.trim();
      if (room) socket.emit('inlay:open', { room_id: room, url: yt, title: 'Aurora – Diluculum' });
    };

    // Auto-open Aurora via query (?aurora=1)
    (function autoAurora(){
      const p = new URLSearchParams(location.search);
      if (p.get('aurora')==='1'){
        const yt = 'https://youtu.be/mNBFnZ4qi5Y?list=OLAK5uy_kq2PVRQQDGLRG4jH1a87Qr22s937BkNSk';
        openInlay(yt, 'Aurora – Diluculum');
      }
    })();

    // auto-connect on load
    connect();
  </script>
</body>
</html>
