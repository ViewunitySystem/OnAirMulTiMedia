<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnAirMulTiMedia - Remote Display</title>
  <style>
    body { font-family: system-ui; margin: 2rem; background: #0a0e27; color: #fff; }
    .container { max-width: 800px; margin: 0 auto; }
    .status { padding: 1rem; background: #1a1e37; border-radius: 10px; margin: 1rem 0; }
    .connected { background: #00ff88; color: #000; }
    .disconnected { background: #ff6b6b; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; background: #00ff88; color: #000; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #00d4aa; }
    #code { width: 100%; height: 200px; background: #1a1e37; color: #fff; border: 1px solid #333; padding: 1rem; }
  </style>
  
  <!-- WebTrit Swipe Technology -->
  <script src="../webtrit-swipe.js"></script>
</head>

    <!-- Navigation Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">🏠 Start</a> 
      <span>›</span> 
      <span>web-remote › display</span>
    </nav>
    
    <style>
      .breadcrumb {
        background: rgba(255,255,255,0.05);
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        font-size: 0.9rem;
      }
      .breadcrumb a {
        color: #7dd3fc;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .breadcrumb span {
        color: #a6b0c9;
        margin: 0 0.5rem;
      }
    </style>
<body data-swipe>
  <div class="container">
    <h1>🎮 OnAirMulTiMedia Remote Display</h1>
    
    <div id="status" class="status disconnected">
      Status: Nicht verbunden
    </div>
    
    <button id="pair">🔗 Pairing starten</button>
    <button id="disconnect" style="display:none;">❌ Verbindung trennen</button>
    
    <h2>📱 Empfangene Befehle:</h2>
    <textarea id="code" placeholder="Hier erscheinen empfangene JavaScript-Befehle..."></textarea>
    
    <h2>📊 Verbindungsinfo:</h2>
    <div id="info">Warten auf Verbindung...</div>
  </div>

  <script>
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    let dataChannel;
    let isConnected = false;
    
    const statusEl = document.getElementById('status');
    const codeEl = document.getElementById('code');
    const infoEl = document.getElementById('info');
    const pairBtn = document.getElementById('pair');
    const disconnectBtn = document.getElementById('disconnect');
    
    // WebRTC Event Handlers
    pc.ondatachannel = evt => {
      dataChannel = evt.channel;
      dataChannel.onmessage = msg => {
        codeEl.value += `\n// Empfangen: ${new Date().toLocaleTimeString()}\n${msg.data}\n`;
        codeEl.scrollTop = codeEl.scrollHeight;
        
        // Demo: JS-Snippets ausführen (NUR FÜR DEMO!)
        try {
          eval(msg.data);
        } catch(e) {
          codeEl.value += `// Fehler: ${e.message}\n`;
        }
      };
      
      dataChannel.onopen = () => {
        isConnected = true;
        statusEl.textContent = 'Status: Verbunden';
        statusEl.className = 'status connected';
        pairBtn.style.display = 'none';
        disconnectBtn.style.display = 'inline-block';
      };
    };
    
    pc.oniceconnectionstatechange = () => {
      infoEl.textContent = `ICE State: ${pc.iceConnectionState}`;
    };
    
    // Pairing-Funktion
    async function startPairing() {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        const offerCode = btoa(JSON.stringify(offer));
        const userCode = prompt('📤 Sende diesen Code an den Controller:', offerCode);
        
        if (!userCode) return;
        
        const answerCode = prompt('📥 Füge hier die Antwort vom Controller ein:');
        if (!answerCode) return;
        
        const answer = JSON.parse(atob(answerCode));
        await pc.setRemoteDescription(answer);
        
      } catch(e) {
        alert(`Fehler beim Pairing: ${e.message}`);
      }
    }
    
    // Disconnect-Funktion
    function disconnect() {
      if (dataChannel) dataChannel.close();
      pc.close();
      isConnected = false;
      statusEl.textContent = 'Status: Verbindung getrennt';
      statusEl.className = 'status disconnected';
      pairBtn.style.display = 'inline-block';
      disconnectBtn.style.display = 'none';
      infoEl.textContent = 'Warten auf neue Verbindung...';
    }
    
    // Event Listeners
    pairBtn.onclick = startPairing;
    disconnectBtn.onclick = disconnect;
    
    // Debug-Info
    console.log('[Remote Display] WebRTC Remote Control POC geladen');
    console.log('[Remote Display] Warten auf Controller-Verbindung...');
  </script>

    <script>
      // Keyboard Navigation
      document.addEventListener('keydown', function(e) {
        // Alt + Left Arrow = Back
        if (e.altKey && e.key === 'ArrowLeft') {
          e.preventDefault();
          window.history.back();
        }
        // Alt + Right Arrow = Forward
        if (e.altKey && e.key === 'ArrowRight') {
          e.preventDefault();
          window.history.forward();
        }
        // Alt + Home = Go to Start
        if (e.altKey && e.key === 'Home') {
          e.preventDefault();
          window.location.href = '/';
        }
        // Escape = Close modal/overlay
        if (e.key === 'Escape') {
          const modals = document.querySelectorAll('.modal, .overlay');
          modals.forEach(modal => {
            if (modal.style.display !== 'none') {
              modal.style.display = 'none';
            }
          });
        }
      });
      
      // Add focus management
      document.addEventListener('DOMContentLoaded', function() {
        // Focus first interactive element
        const firstInteractive = document.querySelector('a, button, input, select, textarea');
        if (firstInteractive) {
          firstInteractive.focus();
        }
      });
    </script>
</body>
</html>
