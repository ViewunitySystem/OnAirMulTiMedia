<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnAirMulTiMedia - Remote Controller</title>
  <style>
    body { font-family: system-ui; margin: 2rem; background: #0a0e27; color: #fff; }
    .container { max-width: 800px; margin: 0 auto; }
    .status { padding: 1rem; background: #1a1e37; border-radius: 10px; margin: 1rem 0; }
    .connected { background: #00ff88; color: #000; }
    .disconnected { background: #ff6b6b; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; background: #00ff88; color: #000; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #00d4aa; }
    textarea { width: 100%; height: 200px; background: #1a1e37; color: #fff; border: 1px solid #333; padding: 1rem; }
    .preset { margin: 0.5rem 0; }
    .preset button { background: #333; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 OnAirMulTiMedia Remote Controller</h1>
    
    <div id="status" class="status disconnected">
      Status: Nicht verbunden
    </div>
    
    <button id="connect">🔗 Mit Display verbinden</button>
    <button id="disconnect" style="display:none;">❌ Verbindung trennen</button>
    
    <h2>📝 JavaScript-Befehle senden:</h2>
    <textarea id="code" placeholder="// JavaScript-Code hier eingeben...
// Beispiel: alert('Hallo von Controller!');
// Beispiel: document.body.style.background = '#ff0000';"></textarea>
    
    <div class="preset">
      <h3>🚀 Preset-Befehle:</h3>
      <button onclick="setPreset('alert')">Alert anzeigen</button>
      <button onclick="setPreset('color')">Farbe ändern</button>
      <button onclick="setPreset('title')">Titel ändern</button>
      <button onclick="setPreset('reload')">Seite neu laden</button>
    </div>
    
    <button id="send" style="display:none;">📤 Befehl senden</button>
    
    <h2>📊 Verbindungsinfo:</h2>
    <div id="info">Warten auf Verbindung...</div>
  </div>

  <script>
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    let dataChannel;
    let isConnected = false;
    
    const statusEl = document.getElementById('status');
    const codeEl = document.getElementById('code');
    const infoEl = document.getElementById('info');
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const sendBtn = document.getElementById('send');
    
    // WebRTC Event Handlers
    pc.oniceconnectionstatechange = () => {
      infoEl.textContent = `ICE State: ${pc.iceConnectionState}`;
    };
    
    // Verbindungs-Funktion
    async function connectToDisplay() {
      try {
        // Data Channel erstellen
        dataChannel = pc.createDataChannel('control');
        dataChannel.onopen = () => {
          isConnected = true;
          statusEl.textContent = 'Status: Verbunden';
          statusEl.className = 'status connected';
          connectBtn.style.display = 'none';
          disconnectBtn.style.display = 'inline-block';
          sendBtn.style.display = 'inline-block';
        };
        
        // Offer erstellen
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        const offerCode = btoa(JSON.stringify(offer));
        const userCode = prompt('📤 Sende diesen Code an das Display:', offerCode);
        
        if (!userCode) return;
        
        // Answer vom Display empfangen
        const answerCode = prompt('📥 Füge hier die Antwort vom Display ein:');
        if (!answerCode) return;
        
        const answer = JSON.parse(atob(answerCode));
        await pc.setRemoteDescription(answer);
        
      } catch(e) {
        alert(`Fehler beim Verbinden: ${e.message}`);
      }
    }
    
    // Disconnect-Funktion
    function disconnect() {
      if (dataChannel) dataChannel.close();
      pc.close();
      isConnected = false;
      statusEl.textContent = 'Status: Verbindung getrennt';
      statusEl.className = 'status disconnected';
      connectBtn.style.display = 'inline-block';
      disconnectBtn.style.display = 'none';
      sendBtn.style.display = 'none';
      infoEl.textContent = 'Warten auf neue Verbindung...';
    }
    
    // Befehl senden
    function sendCommand() {
      if (!isConnected || !dataChannel) return;
      
      const command = codeEl.value.trim();
      if (!command) return;
      
      dataChannel.send(command);
      codeEl.value += '\n// ✅ Gesendet\n';
    }
    
    // Preset-Befehle
    function setPreset(type) {
      const presets = {
        alert: "alert('Hallo von OnAirMulTiMedia Controller!');",
        color: "document.body.style.background = '#ff0000'; setTimeout(() => document.body.style.background = '#0a0e27', 2000);",
        title: "document.title = 'OnAirMulTiMedia - Remote Controlled';",
        reload: "window.location.reload();"
      };
      
      codeEl.value = presets[type] || '';
    }
    
    // Event Listeners
    connectBtn.onclick = connectToDisplay;
    disconnectBtn.onclick = disconnect;
    sendBtn.onclick = sendCommand;
    
    // Debug-Info
    console.log('[Remote Controller] WebRTC Remote Control POC geladen');
    console.log('[Remote Controller] Bereit für Display-Verbindung...');
  </script>
</body>
</html>
