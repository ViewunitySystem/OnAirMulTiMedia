<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20" width="100" height="20">
  <defs>
    <linearGradient id="sparklineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sparkline Chart -->
  <polyline
    fill="none"
    stroke="url(#sparklineGradient)"
    stroke-width="2"
    points="0,15 10,12 20,8 30,5 40,10 50,7 60,3 70,6 80,4 90,2 100,1"
  />
  
  <!-- Data points -->
  <circle cx="0" cy="15" r="1" fill="#3b82f6"/>
  <circle cx="10" cy="12" r="1" fill="#3b82f6"/>
  <circle cx="20" cy="8" r="1" fill="#10b981"/>
  <circle cx="30" cy="5" r="1" fill="#10b981"/>
  <circle cx="40" cy="10" r="1" fill="#10b981"/>
  <circle cx="50" cy="7" r="1" fill="#f59e0b"/>
  <circle cx="60" cy="3" r="1" fill="#f59e0b"/>
  <circle cx="70" cy="6" r="1" fill="#f59e0b"/>
  <circle cx="80" cy="4" r="1" fill="#f59e0b"/>
  <circle cx="90" cy="2" r="1" fill="#f59e0b"/>
  <circle cx="100" cy="1" r="1" fill="#f59e0b"/>
</svg>