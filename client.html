<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnAir MultiMedia – Live Demo</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif; }
    body { margin: 24px; color: #0f172a; background: #f8fafc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .muted { color: #475569; font-size: 12px; }
    .big { font-size: 28px; font-weight: 700; }
    button { padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; }
    button:hover { background: #f1f5f9; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    textarea, input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; }
    pre { white-space: pre-wrap; word-wrap: break-word; background:#0b1220; color:#e2e8f0; padding:12px; border-radius:12px; }
    .ok { color: #16a34a; } .warn { color: #ca8a04; } .err { color: #dc2626; }
  </style>
</head>
<body>
  <h1>OnAir MultiMedia – Live System Check</h1>
  <p class="muted">Dieses Demo lädt echte Werte von deinem Edge-Gateway (<code>/health</code>, <code>/status</code>, <code>/metrics</code>) und verbindet sich mit dem WebSocket-Room.</p>

  <div class="card">
    <div class="row">
      <label>API Base URL</label>
      <input id="api" placeholder="https://api.deine-domain" />
    </div>
    <div class="row" style="margin-top:8px">
      <label>WS Base URL</label>
      <input id="ws" placeholder="wss://api.deine-domain/ws" />
    </div>
    <div class="row" style="margin-top:12px">
      <button id="saveCfg">Konfig setzen</button>
      <span class="muted">(wird in LocalStorage gespeichert)</span>
    </div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card">
      <div class="muted">Health</div>
      <div id="healthVal" class="big">–</div>
      <div class="row" style="margin-top:10px">
        <button id="btnHealth">/health</button>
      </div>
    </div>
    <div class="card">
      <div class="muted">Status</div>
      <div id="statusVal" class="big">–</div>
      <div class="row" style="margin-top:10px">
        <button id="btnStatus">/status</button>
      </div>
    </div>
    <div class="card">
      <div class="muted">Metrics</div>
      <div id="metricsVal" class="big">–</div>
      <div class="row" style="margin-top:10px">
        <button id="btnMetrics">/metrics</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row">
      <input id="room" placeholder="Room-Name" value="global" />
      <button id="btnJoin">Room beitreten</button>
      <button id="btnLeave">Verlassen</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="msg" placeholder="Nachricht" />
      <button id="btnSend">Senden</button>
    </div>
    <pre id="log" style="margin-top:12px; max-height:280px; overflow:auto"></pre>
  </div>

  <script>
    const els = {
      api: document.getElementById('api'),
      ws: document.getElementById('ws'),
      saveCfg: document.getElementById('saveCfg'),
      btnHealth: document.getElementById('btnHealth'),
      btnStatus: document.getElementById('btnStatus'),
      btnMetrics: document.getElementById('btnMetrics'),
      healthVal: document.getElementById('healthVal'),
      statusVal: document.getElementById('statusVal'),
      metricsVal: document.getElementById('metricsVal'),
      room: document.getElementById('room'),
      btnJoin: document.getElementById('btnJoin'),
      btnLeave: document.getElementById('btnLeave'),
      msg: document.getElementById('msg'),
      btnSend: document.getElementById('btnSend'),
      log: document.getElementById('log'),
    };

    function loadCfg() {
      els.api.value = localStorage.getItem('API_BASE_URL') || '';
      els.ws.value = localStorage.getItem('WS_BASE_URL') || '';
    }
    function saveCfg() {
      localStorage.setItem('API_BASE_URL', els.api.value.trim());
      localStorage.setItem('WS_BASE_URL', els.ws.value.trim());
      toast('Konfiguration gespeichert');
    }
    function toast(t) { log(`ℹ️ ${t}`); }

    async function j(path) {
      const base = (els.api.value || '').replace(/\/$/, '');
      const r = await fetch(base + path);
      if (!r.ok) throw new Error(path + ' → ' + r.status);
      return r.json();
    }

    els.saveCfg.onclick = saveCfg;
    els.btnHealth.onclick = async () => {
      try {
        const h = await j('/health');
        els.healthVal.textContent = h.ok ? 'OK' : 'NOK';
        els.healthVal.className = 'big ' + (h.ok ? 'ok' : 'err');
        log('health: ' + JSON.stringify(h));
      } catch (e) { error(e); }
    };
    els.btnStatus.onclick = async () => {
      try { const s = await j('/status'); els.statusVal.textContent = s.appsOnline + ' apps'; log('status: ' + JSON.stringify(s)); }
      catch (e) { error(e); }
    };
    els.btnMetrics.onclick = async () => {
      try { const m = await j('/metrics'); els.metricsVal.textContent = (m.stars||0) + '★'; log('metrics: ' + JSON.stringify(m)); }
      catch (e) { error(e); }
    };

    let ws;
    function connect(room) {
      const u = (els.ws.value || '').replace(/\/$/, '') + '?room=' + encodeURIComponent(room);
      ws = new WebSocket(u);
      ws.onopen = () => { log('WS open ' + u); backoff = 500; };
      ws.onmessage = (e) => log('WS ⇦ ' + e.data);
      ws.onclose = () => { log('WS closed'); if (!closed) retry(); };
      ws.onerror = () => ws.close();
    }
    let closed = false, backoff = 500;
    function retry() {
      setTimeout(() => {
        if (closed) return; backoff = Math.min(backoff * 2, 8000);
        connect(els.room.value);
      }, backoff);
    }

    els.btnJoin.onclick = () => { closed = false; connect(els.room.value); };
    els.btnLeave.onclick = () => { closed = true; try { ws && ws.close(); } catch(_){} };
    els.btnSend.onclick = () => {
      try { ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: 'msg', text: els.msg.value, ts: Date.now() })); log('WS ⇨ ' + els.msg.value); els.msg.value=''; }
      catch(e){ error(e); }
    };

    function log(t) { els.log.textContent += `
${new Date().toLocaleTimeString()}  ${t}`; els.log.scrollTop = els.log.scrollHeight; }
    function error(e) { log('❌ ' + (e.message || e)); }

    loadCfg();
  </script>
</body>
</html>
