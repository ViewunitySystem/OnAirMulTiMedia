<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge Test Client</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background:#0f172a; color:#e5e7eb; }
    header { padding: 12px 16px; background:#111827; position: sticky; top:0; display:flex; gap:12px; align-items:center; }
    main { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; padding:16px; }
    section { background:#111827; border-radius:12px; padding:12px; }
    input, button, select, textarea { background:#0b1020; color:#e5e7eb; border:1px solid #374151; border-radius:8px; padding:8px; width: 100%; }
    button { cursor:pointer; }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .log { height: 40vh; overflow:auto; background:#0b1020; padding:8px; border-radius:8px; }
    .row { margin-bottom:6px; }
    code { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
    .status-online { color: #10b981; }
    .status-offline { color: #ef4444; }
    .status-loading { color: #f59e0b; }

    /* Inlay window */
    .inlay-window { position: fixed; bottom: 16px; right: 16px; width: 560px; height: 320px; background:#000; border:1px solid #374151; border-radius:12px; overflow:hidden; resize: both; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 9999; display:none; }
    .inlay-toolbar { height: 40px; background:#0b1020; color:#e5e7eb; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 8px; cursor:move; user-select:none; }
    .inlay-title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 60%; }
    .inlay-actions { display:flex; gap:6px; }
    .inlay-actions button { width: 36px; height: 28px; padding:0; border-radius:8px; }
    .inlay-iframe { width: 100%; height: calc(100% - 40px); border:0; background:#000; }
    .badge { margin-left: 8px; font-size: 12px; opacity:.8; }
    .simulation-notice { background: #5c4b1a; padding: 8px; border-radius: 6px; margin: 8px 0; font-size: 12px; }
    
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Bridge Test Client</strong>
    <span id="status" class="status-loading">simulated</span>
  </header>
  <main>
    <section>
      <h3>Connect</h3>
      <div class="simulation-notice">
        ⚠️ Simulation Mode: Alle Funktionen werden lokal simuliert
      </div>
      <div style="display:grid; gap:8px;">
        <label>User ID <input id="userId" placeholder="alice" /></label>
        <label>Variant <input id="variant" placeholder="web-ui" /></label>
        <button id="btnConnect">Connect</button>
        <button id="btnDisconnect" disabled>Disconnect</button>
      </div>
      <hr />
      <h3>Room</h3>
      <div style="display:grid; gap:8px;">
        <label>Room ID <input id="room" placeholder="room id" /></label>
        <button id="join">Join</button>
        <button id="leave" disabled>Leave</button>
      </div>
      <hr />
      <h3>Message</h3>
      <div style="display:grid; gap:8px;">
        <textarea id="msg" rows="3" placeholder="Hello world"></textarea>
        <button id="send" disabled>Send</button>
      </div>
      <hr />
      <h3>Inlay / Reference Host</h3>
      <div style="display:grid; gap:8px;">
        <label>URL <input id="inlayUrl" placeholder="https://example.com or YouTube URL"/></label>
        <div style="display:flex; gap:8px;">
          <button id="openInlay">Open Inlay</button>
          <button id="shareInlay" disabled>Open & Share to Room</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="auroraBtn" title="Play Aurora - Diluculum">▶ Aurora – Diluculum</button>
          <span class="badge">privacy-friendly embed</span>
        </div>
      </div>
    </section>
    <section>
      <h3>WebRTC (signaling)</h3>
      <div style="display:grid; gap:8px;">
        <label>Target Session ID <input id="target" placeholder="peer session_id (optional)"/></label>
        <button id="rtcOffer" disabled>Send Offer</button>
        <button id="rtcAnswer" disabled>Send Answer</button>
        <button id="rtcIce" disabled>Send ICE</button>
      </div>
      <hr/>
      <h3>Upload</h3>
      <div style="display:grid; gap:8px;">
        <input type="file" id="file" />
        <button id="upload" disabled>Upload to room</button>
      </div>
      <hr/>
      <h3>Log</h3>
      <div id="log" class="log"></div>
    </section>
  </main>

  <!-- Inlay Window -->
  <div id="inlayWin" class="inlay-window">
    <div class="inlay-toolbar" id="inlayToolbar">
      <div class="inlay-title" id="inlayTitle">Inlay</div>
      <div class="inlay-actions">
        <button id="inlayMax" title="Maximize/Restore">⬜</button>
        <button id="inlayClose" title="Close">✕</button>
      </div>
    </div>
    <iframe id="inlayFrame" class="inlay-iframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script>
    // Bridge Test Client Manager mit lokalen Daten
    class BridgeTestClientManager {
      constructor() {
        this.isConnected = false;
        this.currentRoom = null;
        this.currentUser = null;
        this.sessionId = this.generateSessionId();
        this.logEntries = [];
        this.init();
      }

      init() {
        console.log('🌉 Bridge Test Client Manager initialisiert');
        this.setupEventListeners();
        this.log('System', 'Bridge Test Client gestartet (Simulation Mode)');
        this.log('System', `Session ID: ${this.sessionId}`);
      }

      setupEventListeners() {
        // Connect/Disconnect
        document.getElementById('btnConnect').addEventListener('click', () => {
          this.connect();
        });

        document.getElementById('btnDisconnect').addEventListener('click', () => {
          this.disconnect();
        });

        // Room Management
        document.getElementById('join').addEventListener('click', () => {
          this.joinRoom();
        });

        document.getElementById('leave').addEventListener('click', () => {
          this.leaveRoom();
        });

        // Messaging
        document.getElementById('send').addEventListener('click', () => {
          this.sendMessage();
        });

        // WebRTC
        document.getElementById('rtcOffer').addEventListener('click', () => {
          this.sendRTCOffer();
        });

        document.getElementById('rtcAnswer').addEventListener('click', () => {
          this.sendRTCAnswer();
        });

        document.getElementById('rtcIce').addEventListener('click', () => {
          this.sendRTCIce();
        });

        // Upload
        document.getElementById('upload').addEventListener('click', () => {
          this.uploadFile();
        });

        // Inlay
        document.getElementById('openInlay').addEventListener('click', () => {
          this.openInlay();
        });

        document.getElementById('shareInlay').addEventListener('click', () => {
          this.shareInlay();
        });

        document.getElementById('auroraBtn').addEventListener('click', () => {
          this.playAurora();
        });

        // Inlay Window Controls
        document.getElementById('inlayClose').addEventListener('click', () => {
          this.closeInlay();
        });

        document.getElementById('inlayMax').addEventListener('click', () => {
          this.toggleInlayMaximize();
        });
      }

      connect() {
        const userId = document.getElementById('userId').value.trim() || 'anonymous';
        const variant = document.getElementById('variant').value.trim() || 'web-ui';

        this.currentUser = userId;
        this.isConnected = true;

        this.log('Connect', `Verbunden als ${userId} (${variant})`);
        this.log('Connect', `Session ID: ${this.sessionId}`);

        this.updateUI();
        this.updateStatus('connected', 'status-online');
      }

      disconnect() {
        this.isConnected = false;
        this.currentUser = null;
        this.leaveRoom();

        this.log('Disconnect', 'Verbindung getrennt');
        this.updateUI();
        this.updateStatus('disconnected', 'status-offline');
      }

      joinRoom() {
        const roomId = document.getElementById('room').value.trim() || 'default-room';
        
        if (!this.isConnected) {
          this.log('Error', 'Nicht verbunden - bitte zuerst connecten');
          return;
        }

        this.currentRoom = roomId;
        this.log('Room', `Raum ${roomId} beigetreten`);
        this.updateUI();
      }

      leaveRoom() {
        if (this.currentRoom) {
          this.log('Room', `Raum ${this.currentRoom} verlassen`);
          this.currentRoom = null;
          this.updateUI();
        }
      }

      sendMessage() {
        const message = document.getElementById('msg').value.trim();
        
        if (!message) {
          this.log('Error', 'Keine Nachricht eingegeben');
          return;
        }

        if (!this.isConnected || !this.currentRoom) {
          this.log('Error', 'Nicht verbunden oder kein Raum beigetreten');
          return;
        }

        this.log('Message', `Nachricht gesendet: "${message}"`);
        document.getElementById('msg').value = '';
      }

      sendRTCOffer() {
        const target = document.getElementById('target').value.trim();
        
        if (!target) {
          this.log('Error', 'Target Session ID erforderlich');
          return;
        }

        const offer = {
          type: 'offer',
          sdp: this.generateMockSDP(),
          target: target
        };

        this.log('WebRTC', `Offer gesendet an ${target}`);
        this.log('WebRTC', `SDP: ${offer.sdp.substring(0, 50)}...`);
      }

      sendRTCAnswer() {
        const target = document.getElementById('target').value.trim();
        
        if (!target) {
          this.log('Error', 'Target Session ID erforderlich');
          return;
        }

        const answer = {
          type: 'answer',
          sdp: this.generateMockSDP(),
          target: target
        };

        this.log('WebRTC', `Answer gesendet an ${target}`);
        this.log('WebRTC', `SDP: ${answer.sdp.substring(0, 50)}...`);
      }

      sendRTCIce() {
        const target = document.getElementById('target').value.trim();
        
        if (!target) {
          this.log('Error', 'Target Session ID erforderlich');
          return;
        }

        const iceCandidate = {
          type: 'ice',
          candidate: this.generateMockIceCandidate(),
          target: target
        };

        this.log('WebRTC', `ICE Candidate gesendet an ${target}`);
        this.log('WebRTC', `Candidate: ${iceCandidate.candidate}`);
      }

      uploadFile() {
        const fileInput = document.getElementById('file');
        const file = fileInput.files[0];

        if (!file) {
          this.log('Error', 'Keine Datei ausgewählt');
          return;
        }

        if (!this.isConnected || !this.currentRoom) {
          this.log('Error', 'Nicht verbunden oder kein Raum beigetreten');
          return;
        }

        this.log('Upload', `Datei hochgeladen: ${file.name} (${file.size} bytes)`);
        this.log('Upload', `Typ: ${file.type}`);
        
        // Simuliere Upload-Progress
        this.simulateUploadProgress(file);
      }

      simulateUploadProgress(file) {
        const steps = ['Validierung...', 'Upload...', 'Verarbeitung...', 'Fertig!'];
        let step = 0;

        const interval = setInterval(() => {
          if (step < steps.length) {
            this.log('Upload', steps[step]);
            step++;
          } else {
            clearInterval(interval);
            this.log('Upload', `✅ Upload abgeschlossen: ${file.name}`);
          }
        }, 1000);
      }

      openInlay() {
        const url = document.getElementById('inlayUrl').value.trim();
        
        if (!url) {
          this.log('Error', 'Keine URL eingegeben');
          return;
        }

        const inlayWindow = document.getElementById('inlayWin');
        const inlayFrame = document.getElementById('inlayFrame');
        const inlayTitle = document.getElementById('inlayTitle');

        // Process URL (YouTube, etc.)
        const processedUrl = this.processInlayUrl(url);
        
        inlayFrame.src = processedUrl;
        inlayTitle.textContent = this.extractTitleFromUrl(url);
        inlayWindow.style.display = 'block';

        this.log('Inlay', `Inlay geöffnet: ${url}`);
      }

      shareInlay() {
        const url = document.getElementById('inlayUrl').value.trim();
        
        if (!url) {
          this.log('Error', 'Keine URL eingegeben');
          return;
        }

        if (!this.isConnected || !this.currentRoom) {
          this.log('Error', 'Nicht verbunden oder kein Raum beigetreten');
          return;
        }

        this.openInlay();
        this.log('Inlay', `Inlay geteilt in Raum ${this.currentRoom}: ${url}`);
      }

      playAurora() {
        const auroraUrl = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // Placeholder
        document.getElementById('inlayUrl').value = auroraUrl;
        this.openInlay();
        this.log('Inlay', 'Aurora - Diluculum gestartet');
      }

      closeInlay() {
        const inlayWindow = document.getElementById('inlayWin');
        const inlayFrame = document.getElementById('inlayFrame');
        
        inlayFrame.src = '';
        inlayWindow.style.display = 'none';
        
        this.log('Inlay', 'Inlay geschlossen');
      }

      toggleInlayMaximize() {
        const inlayWindow = document.getElementById('inlayWin');
        const isMaximized = inlayWindow.style.width === '100vw';
        
        if (isMaximized) {
          inlayWindow.style.width = '560px';
          inlayWindow.style.height = '320px';
          inlayWindow.style.top = 'auto';
          inlayWindow.style.left = 'auto';
          inlayWindow.style.bottom = '16px';
          inlayWindow.style.right = '16px';
        } else {
          inlayWindow.style.width = '100vw';
          inlayWindow.style.height = '100vh';
          inlayWindow.style.top = '0';
          inlayWindow.style.left = '0';
          inlayWindow.style.bottom = 'auto';
          inlayWindow.style.right = 'auto';
        }
      }

      processInlayUrl(url) {
        // YouTube URL Processing
        if (url.includes('youtube.com/watch') || url.includes('youtu.be/')) {
          const videoId = this.extractYouTubeId(url);
          return `https://www.youtube-nocookie.com/embed/${videoId}`;
        }
        
        // Direct iframe-compatible URL
        return url;
      }

      extractYouTubeId(url) {
        const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/;
        const match = url.match(regex);
        return match ? match[1] : 'dQw4w9WgXcQ'; // Fallback
      }

      extractTitleFromUrl(url) {
        if (url.includes('youtube.com')) {
          return 'YouTube Video';
        } else if (url.includes('youtu.be')) {
          return 'YouTube Video';
        } else {
          try {
            const urlObj = new URL(url);
            return urlObj.hostname;
          } catch {
            return 'Inlay';
          }
        }
      }

      generateSessionId() {
        return 'session_' + Math.random().toString(36).substr(2, 9);
      }

      generateMockSDP() {
        return `v=0\r\no=- ${Date.now()} ${Date.now()} IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\na=group:BUNDLE 0\r\na=msid-semantic: WMS\r\nm=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\nc=IN IP4 127.0.0.1\r\na=ice-ufrag:mock\r\na=ice-pwd:mock\r\na=ice-options:trickle\r\na=fingerprint:sha-256 mock\r\na=setup:actpass\r\na=mid:0\r\na=sctp-port:5000\r\na=max-message-size:262144\r\n`;
      }

      generateMockIceCandidate() {
        return `candidate:1 1 UDP 2113667326 127.0.0.1 54400 typ host`;
      }

      log(category, message) {
        const timestamp = new Date().toLocaleTimeString('de-DE');
        const logEntry = { timestamp, category, message };
        
        this.logEntries.unshift(logEntry);
        
        const logDiv = document.getElementById('log');
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<code>[${timestamp}] ${category}: ${message}</code>`;
        
        logDiv.insertBefore(row, logDiv.firstChild);
        
        // Limit log entries
        if (this.logEntries.length > 100) {
          this.logEntries = this.logEntries.slice(0, 100);
          if (logDiv.children.length > 100) {
            logDiv.removeChild(logDiv.lastChild);
          }
        }
      }

      updateUI() {
        const joinBtn = document.getElementById('join');
        const leaveBtn = document.getElementById('leave');
        const sendBtn = document.getElementById('send');
        const disconnectBtn = document.getElementById('btnDisconnect');
        const connectBtn = document.getElementById('btnConnect');
        const shareInlayBtn = document.getElementById('shareInlay');
        const uploadBtn = document.getElementById('upload');
        const rtcOfferBtn = document.getElementById('rtcOffer');
        const rtcAnswerBtn = document.getElementById('rtcAnswer');
        const rtcIceBtn = document.getElementById('rtcIce');

        if (this.isConnected) {
          connectBtn.disabled = true;
          disconnectBtn.disabled = false;
          joinBtn.disabled = false;
          uploadBtn.disabled = false;
          rtcOfferBtn.disabled = false;
          rtcAnswerBtn.disabled = false;
          rtcIceBtn.disabled = false;
        } else {
          connectBtn.disabled = false;
          disconnectBtn.disabled = true;
          joinBtn.disabled = true;
          leaveBtn.disabled = true;
          sendBtn.disabled = true;
          shareInlayBtn.disabled = true;
          uploadBtn.disabled = true;
          rtcOfferBtn.disabled = true;
          rtcAnswerBtn.disabled = true;
          rtcIceBtn.disabled = true;
        }

        if (this.currentRoom) {
          leaveBtn.disabled = false;
          sendBtn.disabled = false;
          shareInlayBtn.disabled = false;
        } else {
          leaveBtn.disabled = true;
          sendBtn.disabled = true;
          shareInlayBtn.disabled = true;
        }
      }

      updateStatus(status, className) {
        const statusEl = document.getElementById('status');
        statusEl.textContent = status;
        statusEl.className = className;
      }
    }

    // Auto-Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        window.bridgeTestClientManager = new BridgeTestClientManager();
      });
    } else {
      window.bridgeTestClientManager = new BridgeTestClientManager();
    }
  </script>
</body>
</html>
